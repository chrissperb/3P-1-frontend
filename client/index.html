<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Vendas - Borbolêlalá</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="main-header">
        <div class="logo-area">
            <h1>Borbolêlalá</h1>
            <p>Gestão de Vendas</p>
        </div>

        <div class="mode-switch">
            <a href="index.html" class="switch-option active">PDV (Vendas)</a>
            <a href="estoque.html" class="switch-option">Estoque</a>
        </div>

        <div style="display: flex; align-items: center; gap: 15px; float: right;">
            <span id="user-greeting" style="font-weight: bold; color: var(--primary-color, #9b59b6);">
                </span>
            <button id="btn-logout" style="background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Sair 🚪
            </button>
        </div>
    </header>

    <main class="container">
        <section class="catalog-section">
            <h2>Catálogo de Produtos</h2>
            <div class="filters" id = "dynamic-filters">
            </div>
            <div id="product-grid" class="product-grid">
                </div>
        </section>

        <aside class="sales-panel">
            <div class="cart-container">
                <h2>Resumo do Pedido</h2>
                <div id="cart-items" class="cart-items">
                    <p class="empty-msg">Nenhum item selecionado.</p>
                </div>
                
                <div class="totals-area">
                    <div class="row">
                        <span>Subtotal:</span>
                        <span id="subtotal-display">R$ 0,00</span>
                    </div>
                    <div class="row">
                        <span>Desconto (%):</span>
                        <input type="number" id="discount-input" min="0" max="100" value="0">
                    </div>
                    <div class="row total">
                        <span>Total Final:</span>
                        <span id="total-display">R$ 0,00</span>
                    </div>
                </div>
            </div>

            <div class="customer-data">
                <h3>Entrega (Cálculo de Frete)</h3>
                
                <div class="dimensions-inputs" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;">
                    <input type="number" id="peso-input" placeholder="Peso (kg) ex: 0.3" step="0.1" min="0">
                    <input type="number" id="altura-input" placeholder="Altura (cm)" min="0">
                    <input type="number" id="largura-input" placeholder="Largura (cm)" min="0">
                    <input type="number" id="comprimento-input" placeholder="Comprim. (cm)" min="0">
                </div>

                <div class="cep-search">
                    <input type="text" id="cep-input" placeholder="CEP Destino" maxlength="9">
                    <button id="btn-cep">Calcular</button>
                </div>
                
                <div id="address-result" class="address-result hidden">
                    </div>
            </div>

            <button id="btn-finalize" class="btn-primary full-width">Finalizar Venda</button>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
