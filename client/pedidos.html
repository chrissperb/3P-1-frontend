<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Pedidos - Borbolêlalá</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-area">
            <h1>🦋 Borbolêlalá</h1>
            <p style="color: #7f8c8d; font-size: 0.9rem; font-weight: bold; text-align: center;">Gestão de Pedidos</p>
        </div>

        <div class="nav-switch">
            <a href="/index.html" class="switch-option">🛒 PDV</a>
            <a href="/estoque.html" class="switch-option">📦 Estoque</a>
            <a href="/pedidos.html" class="switch-option active">🧾 Pedidos</a>
        </div>

        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="user-greeting" style="font-weight: bold; color: var(--primary-color);"></span>
            <button id="btn-logout" class="btn-delete-solid" style="padding: 8px 15px; font-weight: bold;">Sair 🚪</button>
        </div>
    </header>

    <div class="pedidos-container">
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Data / ID</th>
                        <th>Cliente / Endereço</th>
                        <th>Itens Comprados</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="pedidos-tbody">
                    </tbody>
            </table>
        </div>

    </div>

    <script src="pedidos.js"></script>
</body>
</html>
