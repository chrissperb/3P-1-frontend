<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Borbolêlalá PDV</title>
    <link rel="stylesheet" href="./styles/style.css"> <style>
        /* Estilos específicos para centralizar a caixa de login */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color, #f4f4f9);
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-container h1 {
            color: var(--primary-color, #9b59b6);
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn-login {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color, #9b59b6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
        .btn-login:hover {
            background-color: var(--primary-dark, #8e44ad);
        }
        #login-error {
            color: red;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>🦋 Borbolêlalá</h1>
        <p>Acesse o Frente de Caixa (PDV)</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="admin@borbolelala.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Sua senha secreta">
            </div>
            
            <button type="submit" class="btn-login" id="btn-submit">Entrar no Sistema</button>
            <p id="login-error"></p>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
