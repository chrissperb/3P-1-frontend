name: Pipeline CI/CD - Borbolêlalá

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # MÁQUINA 1: TESTES DO BACK-END
  # ==========================================
  testes-backend:
    name: Testes do Back-end
    runs-on: ubuntu-latest
    
    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar Dependências (Back)
      run: npm install

    - name: Executar Testes (Back)
      run: npm run test:coverage
      env:
        JWT_SECRET: "segredo-pipeline-ci"
        NODE_ENV: "test"

  # ==========================================
  # MÁQUINA 2: TESTES DO FRONT-END
  # ==========================================
  testes-frontend:
    name: Testes do Front-end
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar Dependências (Front)
      run: npm install

    - name: Executar Testes (Front)
      run: npm run test:coverage